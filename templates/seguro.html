<!DOCTYPE html>
<html>
<head>
<style>
.seguidor {
  background-image: url('rainbow-cat-rainbow.gif');
  position: absolute;
  width: 20px;
  height: 20px;
  background-color: red;
  border-radius: 50%;
  top: -10px; 
  left: -10px;
  pointer-events: none; 
  z-index: 9999; 
}
.botao{
background-color: blue;
color: white;
border: 1px solid green;
justify-content﻿:﻿ center﻿;﻿ ﻿
  ﻿align-items﻿:﻿ center﻿;
  padding: 50px 40px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.3s ease, transform 0.3s ease;
   text-align: center;
  text-decoration: none;
  font-size: 16px;
}
.botao:hover {
 background-image: url('rainbow-cat-rainbow.gif');
background-size: 100% auto; 
  background-repeat: no-repeat;
  background-position: center;
  width: 300px;
  height: 200px;
  transform: scale(2.5); 
  border-radius: 50%; 
}
</style>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Calculo do Seguro</title>
</head>
<div class="seguidor"></div>
<script>
const seguidor = document.querySelector('.seguidor');

document.addEventListener('mousemove', (e) => {
  const x = e.clientX;
  const y = e.clientY;
  seguidor.style.left = x + 'px';
  seguidor.style.top = y + 'px';
});
</script>

</html>
